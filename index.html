<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#30312f">
  <meta name="description" content="Three current games by Santiago Pérez Losanovscky. EVA B2B showcase: Hollow Graves, Reditus Umbrae and Dreadwoods.">
  <title>Current Games — Santiago Pérez Losanovscky</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2330312f'/%3E%3Cpath d='m16 6 10 10-10 10L6 16Z' fill='%23b33b34'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=20261008l">
  <script defer src="./games.config.js?v=20261008l"></script>
  <link rel="stylesheet" href="./documents.css?v=20261008l">
  <script defer src="./documents.js?v=20261008l"></script>
  <script defer src="./app.js?v=20261008l"></script>
</head>
<body data-theme="hollow">
  <a class="skip" href="#game-title">Skip to game</a>
  <div class="shell"><div class="page-edges" aria-hidden="true"></div>
    <aside class="identity" aria-label="Identity and contact">
      <div class="sidebar-art" aria-hidden="true"><img id="sidebar-art" alt=""></div>
      <div class="identity-top"><div class="studio-logo" id="studio-logo"></div><span class="sr-only" id="identity-name"></span><span class="sr-only" id="identity-role"></span><div class="identity-divider"></div><nav id="game-tabs" class="game-tabs" aria-label="Choose a game"></nav></div>
      <div class="identity-bottom"><div class="identity-divider"></div><div class="contact-links" id="contact-links"></div></div>
    </aside>
    <main class="game" id="game-panel" aria-labelledby="game-title">
      <header class="game-heading"><div class="title-group"><h1 id="game-title" tabindex="-1"></h1><p id="game-subtitle"></p></div><ul class="metadata" id="metadata" aria-label="Game details"></ul></header>
      <div class="content-row"><section class="video-frame" id="video-frame" aria-label="Game video"></section><aside class="project-pitch" aria-label="About the game"><div class="project-logo" id="project-logo"></div><div class="pitch-copy"><div class="accent-divider" aria-hidden="true"></div><p id="description-primary"></p><p id="description-secondary"></p></div></aside></div>
      <section class="gallery" aria-label="Game images"><div class="gallery-heading"><h2>Images</h2><span id="image-count"></span></div><div class="gallery-body"><figure class="selected-image" id="selected-image"></figure><div class="thumbnails" id="thumbnails" role="group" aria-label="Choose an image"></div></div></section>
      <section id="document-view" class="document-view" aria-label="Game document" hidden>
        <div class="document-body">
          <section class="pdf-stage" id="pdf-stage" aria-label="PDF page viewer" tabindex="0">
            <div id="pdf-page" class="pdf-page"></div>
            <p id="pdf-status" class="pdf-status" role="status"></p>
            <button id="pdf-prev" class="pdf-arrow previous" aria-label="Previous page" disabled>‹</button>
            <button id="pdf-next" class="pdf-arrow next" aria-label="Next page" disabled>›</button>
          </section>
          <aside class="document-info" aria-label="Document details">
            <div id="document-logo" class="document-logo"></div>
            <div class="document-rule"></div><h2 id="document-title"></h2><p id="document-description"></p>
            <div class="document-metadata">
              <div class="document-meta-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l4 4v16H6ZM14 2v5h4M9 11h6M9 14h6M9 17h6"/></svg><span>PDF document</span></div>
              <div class="document-meta-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h11v15H8ZM5 6H3v16h12v-2M11 7h5M11 10h5M11 13h5"/></svg><span id="pdf-total">Not available yet</span></div>
              <div class="document-meta-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v14H3ZM8 22h8M12 18v4M6 13l5-6M6 7h5v6"/></svg><span>Presentation document</span></div>
            </div>
            <div class="document-actions">
              <a id="pdf-open" class="document-action primary" target="_blank" rel="noopener noreferrer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3l-11 11M10 5H3v16h16v-7"/></svg><span>Open PDF</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
              <a id="pdf-download" class="document-action secondary" download hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M3 16v5h18v-5"/></svg><span>Download PDF</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
            </div>
            <p class="document-helper">Use ← → to navigate</p>
          </aside>
        </div>
        <section class="document-pages" aria-label="Document pages"><div class="document-pages-heading"><h2>Pages</h2><span id="pdf-count" role="status"></span></div><div id="pdf-thumbnails" class="pdf-thumbnails" role="group" aria-label="Choose a PDF page"></div></section>
      </section>
    </main>
    <nav id="material-tabs" class="material-rail" aria-label="Game materials"><h2>Game + Docs</h2></nav>
  </div>
  <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
  <noscript><p class="noscript">Enable JavaScript to switch between Hollow Graves, Reditus Umbrae and Dreadwoods. Contact: santiagolovsky@gmail.com.</p></noscript>
</body>
</html>
